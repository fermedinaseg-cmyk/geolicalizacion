<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Llaves TF2 por USDC/USDT</title>
<style>
  body{font-family:system-ui,sans-serif;background:#1b1b1f;color:#eee;max-width:480px;margin:2rem auto;padding:0 1rem}
  input,button{width:100%;padding:.7rem;margin:.3rem 0;border-radius:6px;border:1px solid #444;background:#2a2a30;color:#eee;font-size:1rem;box-sizing:border-box}
  button{background:#e0a030;color:#111;font-weight:700;cursor:pointer}
  .card{background:#25252b;padding:1rem;border-radius:8px;margin-top:1rem}
  code{word-break:break-all;background:#111;padding:.2rem .4rem;border-radius:4px}
</style>
</head>
<body>
<h1>🔑 Llaves TF2</h1>
<div id="info">Cargando…</div>
<div style="display:flex;gap:.5rem"><button id="tSell" type="button">Comprar llaves</button><button id="tBuy" type="button" style="background:#555;color:#eee">Vender llaves</button></div>
<form id="f" class="card">
  <label>Trade URL de Steam <input id="url" required placeholder="https://steamcommunity.com/tradeoffer/new/?partner=…&token=…"></label>
  <label>Cantidad <input id="qty" type="number" min="1" value="1" required></label>
  <div id="buyFields" hidden>
    <label>Tu dirección Polygon (para recibir el pago) <input id="addr" placeholder="0x…"></label>
    <label>Cobrar en <select id="tok" style="width:100%;padding:.7rem;margin:.3rem 0;border-radius:6px;background:#2a2a30;color:#eee"><option>USDC</option><option>USDT</option></select></label>
  </div>
  <div id="quote"></div>
  <button id="go">Comprar</button>
  <div id="err" style="color:#f66"></div>
</form>
<div id="order" class="card" hidden></div>
<script>
const $ = (id) => document.getElementById(id);
let inf = null, side = 'sell';
async function info() {
  const r = await (await fetch('/api/info')).json();
  inf = r;
  $('info').textContent = `Vendemos a $${r.sellUsd} · Compramos a $${r.buyUsd} · Stock: ${r.sellStock} · ${r.online ? 'Bot en línea' : 'Bot fuera de línea'}`;
  refreshForm();
}
function refreshForm() {
  if (!inf) return;
  const buy = side === 'buy', q = Number($('qty').value) || 0, unit = buy ? inf.buyUsd : inf.sellUsd;
  $('buyFields').hidden = !buy;
  $('go').textContent = buy ? 'Vender mis llaves' : 'Comprar';
  $('qty').max = Math.min(inf.maxPerOrder, buy ? inf.buyRoom : inf.sellStock);
  $('quote').textContent = `${buy ? 'Recibirás' : 'Pagarás'} ≈ $${(unit * q).toFixed(2)} (${q} × $${unit}). Precio fijado al crear el pedido.`;
}
function setSide(s) { side = s; $('tSell').style.background = s === 'sell' ? '#e0a030' : '#555'; $('tBuy').style.background = s === 'buy' ? '#e0a030' : '#555'; $('tSell').style.color = s === 'sell' ? '#111' : '#eee'; $('tBuy').style.color = s === 'buy' ? '#111' : '#eee'; refreshForm(); }
$('tSell').onclick = () => setSide('sell'); $('tBuy').onclick = () => setSide('buy'); $('qty').oninput = refreshForm;
function show(o) {
  const el = $('order'); el.hidden = false;
  const labels = {awaiting_items:'Acepta la oferta de intercambio en Steam para entregarnos tus llaves',paying:'Llaves recibidas, enviando tu pago',pending_payment:'Esperando pago',paid:'Pago recibido',sending:'Enviando oferta de intercambio — acéptala en Steam',completed:'¡Completado!',expired:'Expirado',manual_review:'En revisión manual (contacta soporte con tu #'+o.id+')'};
  el.innerHTML = `<h3>Pedido #${o.id}: ${labels[o.status]}</h3>` +
    (o.status === 'completed' && o.side === 'buy' ? `<p>Pago enviado: <code>${o.txHash}</code></p>` : '') +
    (o.status === 'pending_payment' ? `<p>Envía <b>${o.total}</b> USDC <u>o</u> USDT por la red <b>Polygon</b> a:</p><p><code>${o.address}</code></p><p>Envía el monto exacto (o más) en una sola transferencia. Caduca a las ${new Date(o.expiresAt).toLocaleTimeString()}. La confirmación tarda ~1 min.</p><p>⚠️ Otra red = fondos perdidos.</p>` : '');
  if (['pending_payment','paid','sending','awaiting_items','paying'].includes(o.status)) setTimeout(() => poll(o.id), 8000);
}
async function poll(id) { show(await (await fetch('/api/orders/' + id)).json()); }
$('f').onsubmit = async (e) => {
  e.preventDefault(); $('err').textContent = '';
  const r = await fetch('/api/orders', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({side,tradeUrl:$('url').value,qty:Number($('qty').value),payoutAddress:$('addr').value,payoutToken:$('tok').value})});
  const j = await r.json();
  if (!r.ok) return $('err').textContent = j.error;
  localStorage.setItem('order', j.id); show(j);
};
info(); setInterval(info, 30000);
const last = localStorage.getItem('order'); if (last) poll(last);
</script>
</body>
</html>
